<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242A35"/>
      <stop offset="100%" stop-color="#151920"/>
    </linearGradient>
    <linearGradient id="topFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFF4FA"/>
      <stop offset="100%" stop-color="#C8D4E4"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6AA2EB"/>
      <stop offset="100%" stop-color="#4A7EC4"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B629B"/>
      <stop offset="100%" stop-color="#27436E"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg)" stroke="#384252" stroke-width="1.5"/>
  <!-- Isometric faceted hexagon cube -->
  <polygon points="32,12 50,22 32,32 14,22" fill="url(#topFace)"/>
  <polygon points="14,22 32,32 32,52 14,42" fill="url(#leftFace)"/>
  <polygon points="32,32 50,22 50,42 32,52" fill="url(#rightFace)"/>
  <!-- Crisp geometric facet edges -->
  <polyline points="14,22 32,32 50,22" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.2" stroke-linejoin="round"/>
  <line x1="32" y1="32" x2="32" y2="52" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="1.2"/>
  <polygon points="32,12 50,22 50,42 32,52 14,42 14,22" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
